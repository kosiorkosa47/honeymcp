services:
  # pgvector-flavoured Postgres for the `postgres` feature build and the
  # analysis pipeline. Not required for a stock honeymcp deployment —
  # start it only when you want the Postgres backend or embeddings.
  #
  #   docker compose up -d postgres
  #   make db-migrate
  postgres:
    image: pgvector/pgvector:pg16
    container_name: honeymcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: honeymcp
      POSTGRES_PASSWORD: honeymcp_dev
      POSTGRES_DB: honeymcp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeymcp -d honeymcp"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  honeymcp:
    build:
      context: .
      args:
        HONEYMCP_GIT_SHA: ${HONEYMCP_GIT_SHA:-unknown}
        HONEYMCP_BUILD_UNIX_TS: ${HONEYMCP_BUILD_UNIX_TS:-}
    image: honeymcp:0.7.0

    container_name: honeymcp
    restart: unless-stopped
    # Resource caps - a honeypot should never be the reason the host falls over.
    # A crafted payload that tries to OOM the container or spin the CPU just hits
    # the wall and moves on; the host keeps running.
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 256
    # Drop every Linux capability; honeymcp only needs to read its persona file,
    # write to /var/lib/honeymcp, and bind a TCP socket (which is already handled
    # by Docker's port publish, not the container process).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Root filesystem read-only. Writable state lives on the explicitly mounted
    # volumes below. Crash-loops from attacker input can't persist anything
    # outside the DB.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports:
      # Bind to loopback only: the honeypot is reached through Caddy
      # (reverse_proxy 127.0.0.1:8080), never directly from the internet. This
      # keeps a single logged entry point and stops a scanner from hitting the
      # backend on :8080, bypassing the proxy.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/var/lib/honeymcp
      - ./personas:/opt/honeymcp/personas:ro
      # Real Thinkst canary tokens (gitignored). Mounted read-only; the binary
      # auto-loads ./canaries.yaml from its WORKDIR. If the host file is absent
      # the container still boots and {{canary.*}} renders realistic fakes.
      - ./canaries.yaml:/opt/honeymcp/canaries.yaml:ro
    environment:
      - RUST_LOG=info,honeymcp=debug
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
